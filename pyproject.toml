[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cortex-brand-analysis"
version = "0.1.0"
description = "Auditable agents and workflows for Cortex brand analysis operations"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "pandas>=2.2,<3",
  "python-dotenv>=1.0,<2",
  "beautifulsoup4>=4.12,<5",
  "boto3>=1.35,<2"
]

[project.optional-dependencies]
ai = [
  "openai>=1.50,<2"
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
  "mypy>=1.13,<2"
]

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_brand_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true


[tool.ruff.lint.per-file-ignores]
"src/cortex_brand_analysis/api/*.py" = ["B008"]
