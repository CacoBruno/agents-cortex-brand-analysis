[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cortex-brand-analysis"
version = "0.1.0"
description = "Auditable agents and workflows for Cortex brand analysis operations"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "httpx>=0.27,<1",
  "pandas>=2.2,<3",
  "python-dotenv>=1.0,<2",
  "beautifulsoup4>=4.12,<5",
  "boto3>=1.35,<2"
]

[project.scripts]
cortex-brand-legacy-mcp = "cortex_brand_analysis.compat_entrypoints:run_legacy_mcp"
cortex-brand-legacy-pria = "cortex_brand_analysis.compat_entrypoints:run_legacy_pria"

[project.optional-dependencies]
ai = [
  "openai>=1.50,<2"
]
legacy = [
  "langchain>=0.3,<0.4",
  "langchain-core>=0.3,<0.4",
  "langchain-openai>=0.3,<0.4",
  "langchain-community>=0.3,<0.4",
  "langgraph>=0.2,<0.3",
  "langgraph-checkpoint-sqlite>=3,<4",
  "fastmcp>=3,<4",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<1",
  "numpy>=1.26,<3",
  "scikit-learn>=1.5,<2",
  "requests>=2.32,<3",
  "unidecode>=1.4,<2",
  "tqdm>=4.67,<5",
  "lxml>=5,<6",
  "lxml-html-clean>=0.4,<1",
  "newspaper3k>=0.2,<1",
  "python-pptx>=1,<2"
]
legacy-ml = [
  "nltk>=3.9,<4",
  "transformers>=4.44,<5",
  "sentence-transformers>=3,<4",
  "spacy>=3.7,<4",
  "factor-analyzer>=0.5,<1",
  "torch>=2.4,<3",
  "keras>=3.3,<4",
  "tensorflow>=2.16,<3"
]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
  "mypy>=1.13,<2",
  "pandas-stubs>=2.2,<3",
  "boto3-stubs[s3]>=1.35,<2"
]

[tool.hatch.build.targets.wheel]
packages = ["src/cortex_brand_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --disable-warnings --maxfail=1"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true


[tool.ruff.lint.per-file-ignores]
"src/cortex_brand_analysis/api/*.py" = ["B008"]
